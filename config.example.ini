; Standalone/CLI configuration. Native AstrBot deployments use _conf_schema.json
; and AstrBotConfig; this file is an equivalent documented INI representation.

[mcp]
; Current MCC build: HTTP MCP endpoint
transport = http
url = http://127.0.0.1:33333/mcp
poll_interval = 2
chat_tool = mcc_recent_events
chat_max_count = 50
; Legacy WebSocket profile uses host/port and optional authentication.
host = 127.0.0.1
port = 25575
password =
auth_mode = auto
subscribe_ack = false
reconnect_initial_delay = 1
reconnect_max_delay = 30
connect_timeout = 10
auth_timeout = 10
subscribe_timeout = 10

[target]
; QQ Official: qq_official + group openid (or channel_id)
; OneBot v11: aiocqhttp + numeric group number
platform_name = qq_official
platform_instance = default
message_type = GroupMessage
group_id = your_group_openid
; Empty uses AstrBot's native UMO: platform_name:message_type:group_id
umo_template =
; If you only have AstrBot's full UMO, leave group_id empty and paste it here.
umo_override =
; Optional compatibility alias when your source calls this field `umo`.
umo =
message_template = [Minecraft] <{sender}> {message}

[filter]
enabled = true
ignore_bot_messages = true
bot_name = MCCBot
ignore_system_messages = true
ignore_join_messages = true
ignore_leave_messages = true
ignore_death_messages = true
ignore_advancement_messages = true
ignore_server_announcements = true
ignore_empty_messages = true
ignore_command_messages = true
command_prefixes = /,!
enable_player_blacklist = false
blacklist_players =
enable_player_whitelist = false
whitelist_players =
enable_keyword_filter = false
blocked_keywords =
keyword_case_sensitive = false
keyword_whole_word = false
enable_regex_filter = false
blocked_regex =

[dedup]
enabled = true
cache_size = 1000
ttl_seconds = 300
state_file = data/dedup_cache.json

[retry]
max_attempts = 5
initial_delay_seconds = 1
max_delay_seconds = 30
queue_file = data/failed_messages.json
replay_failed_messages = true
max_queue_size = 1000
drop_expired_messages = false
message_expire_seconds = 3600

[security]
max_message_length = 500
rate_limit_per_second = 5
split_long_messages = true
merge_messages = false
merge_window_seconds = 3

[logging]
level = INFO
log_file = logs/plugin.log
max_bytes = 10485760
backup_count = 5

[protocol]
; JSON object templates. {password} and {event} are substituted.
auth_template_json = {"type":"auth","password":"{password}"}
subscribe_template_json = {"type":"subscribe","event":"{event}"}
event_name = PlayerMessage
event_type_path = type
event_name_path = event
auth_status_path = status
auth_success_values_json = ["success", "ok", true]

[parser]
sender_paths_json = ["player", "sender", "data.player", "payload.player"]
message_paths_json = ["message", "text", "data.message", "payload.message"]
timestamp_paths_json = ["timestamp", "time", "data.timestamp", "payload.timestamp"]
kind_paths_json = ["kind", "message_type", "data.kind", "payload.kind"]
event_id_paths_json = ["id", "event_id", "data.id", "payload.id"]
kind_map_json = {}
